# DataNexus AI - Nginx Reverse Proxy & HITNET Security Gateway Config

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Logging
    log_format hitnet_log '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log hitnet_log;
    error_log  /var/log/nginx/error.log warn;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream datanexus_api {
        server datanexus_app:8000;
    }

    server {
        listen 80;
        server_name datanexus.otc-telekom.de;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name datanexus.otc-telekom.de;

        ssl_certificate     /etc/nginx/ssl/datanexus.crt;
        ssl_certificate_key /etc/nginx/ssl/datanexus.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # HITNET IP Whitelisting (Subnetz Beschränkung für Kundennetzwerk)
        allow 10.0.0.0/8;      # OTC Interne VPC
        allow 192.168.1.0/24;  # Kunden On-Premise Subnetz
        allow 127.0.0.1;       # Localhost
        deny all;              # Sperrt alle restlichen IPs ab

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://datanexus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://datanexus_api/health;
            access_log off;
        }
    }
}
