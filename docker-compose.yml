version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datanexus_postgres
    environment:
      POSTGRES_DB: datanexus_db
      POSTGRES_USER: datanexus_user
      POSTGRES_PASSWORD: datanexus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datanexus_user -d datanexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: datanexus_milvus_vector_db
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  datanexus_app:
    build: .
    container_name: datanexus_api_service
    environment:
      DATABASE_URL: postgresql://datanexus_user:datanexus_password@postgres:5432/datanexus_db
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    ports:
      - "8000:8000"
    volumes:
      - ./incoming:/app/incoming
      - ./quarantine:/app/quarantine
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  milvus_data:
